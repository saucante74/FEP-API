services:
  mysql:
    image: mysql:8.3
    restart: unless-stopped
    container_name: fep-local-db-mysql
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
    ports:
      - "3307:3306"
    volumes:
      - .data/db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: fep-local-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build: .
    image: fep-api:dev
    container_name: fep-local-api
    env_file: ./.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQLDB_DATABASE}
      SPRING_MAIL_HOST: mailhog
    ports:
      - "8080:8080"